    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      .contact-section {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem 1rem 4rem;
      }

      .contact-card {
        background: #ffffff;
        border: 4px solid var(--ink, #1a1a1a);
        box-shadow: 8px 8px 0 var(--ink, #1a1a1a);
        border-radius: 20px;
        padding: 2.5rem 2rem;
        max-width: 580px;
        width: 100%;
      }

      .contact-badge {
        display: block;
        background: var(--yellow, #ffd23f);
        border: 3px solid var(--ink, #1a1a1a);
        box-shadow: 4px 4px 0 var(--ink, #1a1a1a);
        border-radius: 14px;
        padding: 0.8rem 1.25rem;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--ink, #1a1a1a);
        margin-bottom: 2rem;
        text-align: center;
      }

      .contact-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .contact-item {
        background: #fff8d6;
        border: 3px solid var(--ink, #1a1a1a);
        box-shadow: 4px 4px 0 var(--ink, #1a1a1a);
        border-radius: 12px;
        padding: 0.85rem 1.25rem;
        display: flex;
        align-items: center;
        gap: 0.85rem;
        text-decoration: none;
        color: var(--ink, #1a1a1a);
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition:
          transform 0.1s ease,
          box-shadow 0.1s ease,
          background-color 0.1s ease;
        word-break: break-all;
      }

      .contact-item:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--ink, #1a1a1a);
        background: var(--yellow, #ffd23f);
      }

      .contact-item:active {
        transform: translate(1px, 1px);
        box-shadow: 2px 2px 0 var(--ink, #1a1a1a);
      }

      .contact-icon {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
